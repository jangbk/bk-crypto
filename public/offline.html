<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 | BK CRYPTO</title>
    <style>
      :root {
        --bg: #12141f;
        --surface: #1a1d2e;
        --border: #2b3048;
        --text: #e7e9f0;
        --muted: #8d93a8;
        --accent: #3b82f6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 26rem;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }
      .mark {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      h1 { margin: 1.25rem 0 0.5rem; font-size: 1.375rem; }
      p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
      button {
        margin-top: 1.75rem;
        padding: 0.625rem 1.75rem;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: opacity 150ms ease;
      }
      button:hover { opacity: 0.88; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">BK CRYPTO</p>
      <h1>오프라인 상태입니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요. 연결이 복구되면 마지막으로 보던 화면으로 돌아갑니다.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
